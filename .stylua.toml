# StyLua Configuration
# https://github.com/JohnnyMorganz/StyLua

syntax = "Lua54"
column_width = 80
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Input"
space_after_function_names = "Never"
block_newline_gaps = "Preserve"
collapse_simple_statement = "Never"

[sort_requires]
enabled = true
